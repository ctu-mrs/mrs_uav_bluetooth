# Added by mrs-uav-bluetooth-service.
# mrs-bluez performs Mesh AES-CCM in userspace and needs no kernel AEAD helper.
[Service]
ExecStart=
ExecStart=/usr/lib/mrs-uav-bluetooth/mesh-daemon
# Linux's MGMT Mesh receive bit can survive daemon exit and radio power cycles.
ExecStopPost=/usr/lib/mrs-uav-bluetooth/mesh-daemon --release
TimeoutStopSec=5s
