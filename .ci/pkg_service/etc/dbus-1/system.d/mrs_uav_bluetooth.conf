<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="mrs">
    <allow own="cz.cvut.mrs.uav.ble.client"/>
    <allow own="cz.cvut.mrs.uav.ble.server"/>
    <allow send_destination="org.bluez"/>
  </policy>

  <policy context="default">
    <allow send_destination="cz.cvut.mrs.uav.ble.client"/>
    <allow send_destination="cz.cvut.mrs.uav.ble.server"/>
  </policy>
</busconfig>
