# Safe settings used when no example is running.
# Start with config/README.md and copy one file from config/examples.

# -----------------------------------------------------------------------------
# General settings
# Root name for this UAV's ROS topics.
node_topics_prefix: "/{hostname}/bluetooth"

# Seconds between device-list updates.
scan_publish_period: 2.0

# Seconds between clock updates.
time_update_period: 1.0

# Seconds between Wi-Fi list updates.
wifi_refresh_period: 2.0

# Seconds between connection attempts.
auto_connect_period: 3.0

# Seconds to remain visible; 0 means always.
discoverable_timeout: 0

# -----------------------------------------------------------------------------
# Access and optional features
# Approve and remember allowed UAVs automatically.
auto_pair: true
auto_trust: true

# Share clock and Wi-Fi choices with connected UAVs.
enable_time_service: true
enable_wifi_service: true

# Allow an SSH shell over Bluetooth.
enable_serial_port_profile: true
serial_port_channel: 22
serial_sshd_path: /usr/sbin/sshd

# -----------------------------------------------------------------------------
# Mesh settings. Copy them from the Mesh example.
enable_mesh: false
mesh_auto_attach: true
mesh_auto_join: false
mesh_auto_create_network: false
mesh_provisioner: false
# Relay Mesh data for other UAVs.
mesh_auto_configure_relay: false
# Maximum Mesh relay hops.
mesh_default_ttl: 127
# Repeat forwarded data.
mesh_relay_retransmit_count: 1
mesh_relay_retransmit_interval_steps: 2
# Repeat this UAV's data.
mesh_network_retransmit_count: 1
mesh_network_retransmit_interval_steps: 19

# Create or join the Mesh automatically.
mesh_swarm_auto_provisioning: false
mesh_swarm_id: 1
mesh_swarm_participating: true
mesh_swarm_state_path: "/var/lib/mrs_uav_bluetooth/swarm-{hostname}.txt"
# Select the first available UAV as Mesh provisioner.
mesh_provisioner_preference: ordered
# Seconds to wait before creating the Mesh.
mesh_swarm_startup_grace: 5.0
mesh_swarm_heartbeat_period: 1.0
# Seconds before a silent UAV is considered gone.
mesh_swarm_provisioner_timeout: 20.0
mesh_swarm_group_address: 0xc000
mesh_swarm_network_index: 0
mesh_swarm_app_key_index: 0
# Remembers which Mesh addresses are free.
mesh_unicast_cursor_path: "/var/lib/mrs_uav_bluetooth/mesh-unicast-{hostname}.cursor"

# Empty values are filled and saved automatically.
mesh_device_uuid: ""
mesh_token: 0
mesh_token_path: "/var/lib/mrs_uav_bluetooth/mesh-{hostname}.token"
mesh_company_id: 0x05f1
mesh_product_id: 0x0001
mesh_version_id: 0x0001
mesh_crpl: 100
mesh_vendor_model_id: 0x0001
mesh_next_unicast: 0x0100
mesh_agent_capabilities: []
mesh_agent_oob_info: []
mesh_agent_static_oob: []
mesh_agent_private_key: []
mesh_agent_public_key: []
mesh_agent_numeric_oob: 0
mesh_agent_uri: ""

# -----------------------------------------------------------------------------
# GATT settings
# Optional connection filter; normally empty.
gatt_profile_uuids: []

# Whether this UAV starts GATT connections.
auto_connect_enable: true

# Allowed UAV names. Empty accepts every matching UAV.
peer_whitelist: []

# Names must match this pattern.
auto_connect_pattern: "^uav[0-9]{1,5}$"

# Seconds before closing an unused GATT connection.
peer_connection_timeout: 15.0

# -----------------------------------------------------------------------------
# Wi-Fi choices
# System file changed after an approved choice.
wifi_netplan_config_path: /etc/netplan/01-netcfg.yaml

# Networks another UAV may select.
allowed_wifi_networks:
  - mrs_ctu
  - mrs_ctu_1
  - mrs_ctu_2
  - mrs_ctu_3
  - mrs_ctu_4
  - mrs_ctu_5
  - mrs_ctu_6
  - mrs_ctu_7
  - mrs_ctu_8
  - mrs_ctu_9

# -----------------------------------------------------------------------------
# Status and example lifetime
# Seconds between status lines; 0 disables them.
status_report_period: 1.0

# Publish detailed logs as a ROS topic.
log_topic_enable: false

# End links made by an example when it stops.
expire_connections_with_overlay: true

# Internal signal that keeps an example active.
overlay_keepalive_topic_suffix: overlay_keepalive

# Detailed log file; empty disables it.
verbose_log_file: ""

# -----------------------------------------------------------------------------
# Advertisement settings. Copy them from the Advertisement example.
advertise_mode: peripheral

# "legacy" works with older radios; "extended" carries more data.
advertise_size: legacy
# Tested update method.
advertise_update_strategy: reregister
# Repeat interval in milliseconds.
advertise_min_interval: 100
advertise_max_interval: 100
# Include this UAV's name.
advertise_local_name: "{hostname}"

# ROS topic for raw Advertisements; empty disables it.
advertise_extra_data_topic: "/{hostname}/bluetooth/le/advertisement"

pairing_agent: NoInputNoOutput
enable_server: true
enable_scan: true
scan_mode: le

# -----------------------------------------------------------------------------
# Shared ROS topics. Copy an example entry unchanged on every UAV.
shared_topics: []
