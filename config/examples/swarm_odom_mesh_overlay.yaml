# Mesh example: shares complete odometry and relays it through other UAVs.
# Copy this file, list all UAVs below, and deploy the same copy everywhere.
# Start user_node with config_path:=<absolute path to the copy>.
# Received data appears below /<this-uav>/bluetooth/mesh/peers.

# -----------------------------------------------------------------------------
# Mesh settings
node_topics_prefix: "/{hostname}/bluetooth"
enable_mesh: true
mesh_swarm_auto_provisioning: true
# Start or join automatically and remember the setup.

# Keep this ordered list the same everywhere.
peer_whitelist:
  - uav42
  - uav99

# The first available UAV becomes the Mesh provisioner.
mesh_provisioner_preference: ordered
# Seconds between check-ins.
mesh_swarm_heartbeat_period: 3.0
# Seconds before a silent UAV is considered gone.
mesh_swarm_provisioner_timeout: 20.0
# Keep at zero; missing data is retried automatically.
mesh_network_retransmit_count: 0

# -----------------------------------------------------------------------------
# Data to send
# Keep this section identical on all UAVs.
shared_topics:
  - name: swarm_odometry_mesh
    transport: mesh
    channel_id: 1001
    mode: both
    payload_format: struct
    export_topic: /{hostname}/mavros/local_position/odom
    import_topic_suffix: mavros/local_position/odom
    message_type: nav_msgs/msg/Odometry
    # Offer the newest value up to ten times per second.
    rate_hz: 10.0
    # Internal labels; keep them identical on every UAV.
    app_key_index: 0
    element_index: 0
    force_segmented: true
    vendor_opcode: 0xc1
    company_id: 0x05f1
    members_encode:
      - target: seconds
        type: uint32
        expression: header.stamp.sec
      - target: nanoseconds
        type: uint32
        expression: header.stamp.nanosec
      - target: pose.pose.position.x
        type: float32
      - target: pose.pose.position.y
        type: float32
      - target: pose.pose.position.z
        type: float32
      - target: pose.pose.orientation.x
        type: float32
      - target: pose.pose.orientation.y
        type: float32
      - target: pose.pose.orientation.z
        type: float32
      - target: pose.pose.orientation.w
        type: float32
      - target: twist.twist.linear.x
        type: float32
      - target: twist.twist.linear.y
        type: float32
      - target: twist.twist.linear.z
        type: float32
      - target: twist.twist.angular.x
        type: float32
      - target: twist.twist.angular.y
        type: float32
      - target: twist.twist.angular.z
        type: float32
    # Rebuild the usual ROS time fields.
    members_decode:
      - target: header.stamp.sec
        expression: seconds
      - target: header.stamp.nanosec
        expression: nanoseconds
