# Node: user_node (overlay applied to the background service_node)
# Purpose: share timestamped odometry through connectionless BLE advertisements.
# Usage: ros2 launch mrs_uav_bluetooth user_node.launch.py config_path:=<absolute-path-to-this-file>
# Run the optional random_odometry_publisher launch if no estimator is available.

node_topics_prefix: "/{hostname}/bluetooth"

# Advertisement topic sharing is a connectionless mode. Broadcast advertising
# and disabled GATT/pairing settings prevent a connection from stopping the
# controller's advertisement data stream.
advertise_mode: broadcast
advertise_size: legacy
# The 26-byte bare value occupies the full primary legacy packet after BLE
# overhead. BlueZ places this local name in the scan response on both test UAVs.
advertise_local_name: "{hostname}"
advertise_discoverable: false
enable_server: true
enable_scan: true
enable_time_service: false
enable_wifi_service: false
enable_serial_port_profile: false
auto_connect_enable: false
auto_pair: false
auto_trust: false
# Global admission list for this example. Empty would accept every nearby peer.
peer_whitelist:
  - uav42
  - uav99

# A legacy advertisement holds 31 bytes. BLE flags use 3 bytes and the
# advertisement Data field header uses 2. The bare codec fills the remaining
# 26 bytes with an 8-byte Unix nanosecond timestamp, 6 bytes for
# quaternion-derived roll/pitch/yaw, and three float32 XYZ coordinates (12 B).
# Types below describe the final wire representation. The general encode and
# decode expressions perform every conversion, with no odometry-specific codec.
# Received samples appear below:
# /{hostname}/bluetooth/le/peers/<peer>/mavros/local_position/odom
shared_topics:
  - name: swarm_odometry_advertisement
    transport: advertisement
    framing: bare
    mode: both
    payload_format: struct
    export_topic: /{hostname}/mavros/local_position/odom
    import_topic_suffix: mavros/local_position/odom
    message_type: nav_msgs/msg/Odometry
    rate_hz: 1.0
    members_encode:
      # Integer-only arithmetic preserves the full Unix nanosecond value.
      - target: timestamp_ns
        type: uint64
        expression: header.stamp.sec * 1000000000 + header.stamp.nanosec

      # The source quaternion is expected to be normalized, as ROS odometry
      # quaternions normally are. Each signed 16-bit integer stores an angle
      # in units of pi / 32767. The four reconstruction relations below turn
      # the decoded integers back into a unit quaternion in members_decode.
      - target: roll
        type: int16
        expression: >-
          (32767.0 / pi) * atan2(2.0 * (pose.pose.orientation.w * pose.pose.orientation.x +
          pose.pose.orientation.y * pose.pose.orientation.z),
          1.0 - 2.0 * (pose.pose.orientation.x * pose.pose.orientation.x +
          pose.pose.orientation.y * pose.pose.orientation.y))
      - target: pitch
        type: int16
        expression: >-
          (32767.0 / pi) * asin(clamp(2.0 * (pose.pose.orientation.w * pose.pose.orientation.y -
          pose.pose.orientation.z * pose.pose.orientation.x), -1.0, 1.0))
      - target: yaw
        type: int16
        expression: >-
          (32767.0 / pi) * atan2(2.0 * (pose.pose.orientation.w * pose.pose.orientation.z +
          pose.pose.orientation.x * pose.pose.orientation.y),
          1.0 - 2.0 * (pose.pose.orientation.y * pose.pose.orientation.y +
          pose.pose.orientation.z * pose.pose.orientation.z))

      # The three position members are copied directly as float32 metres.
      - target: pose.pose.position.x
        type: float32
      - target: pose.pose.position.y
        type: float32
      - target: pose.pose.position.z
        type: float32

    # These relations rebuild ROS fields from the named wire values above.
    members_decode:
      - target: header.stamp.sec
        expression: timestamp_ns / 1000000000
      - target: header.stamp.nanosec
        expression: timestamp_ns % 1000000000
      - target: pose.pose.orientation.w
        expression: >-
          cos(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) +
          sin(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.x
        expression: >-
          sin(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) -
          cos(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.y
        expression: >-
          cos(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) +
          sin(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.z
        expression: >-
          cos(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0) -
          sin(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0)
