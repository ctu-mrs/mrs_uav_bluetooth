# Advertisement example: broadcasts position and orientation without connecting.
# Copy this file, list all UAVs below, and deploy the same copy everywhere.
# Start user_node with config_path:=<absolute path to the copy>.
# Updates may be missed. Received data appears below /<this-uav>/bluetooth/le/peers.

# -----------------------------------------------------------------------------
# Advertisement settings
node_topics_prefix: "/{hostname}/bluetooth"

# Keep these values together.
advertise_mode: broadcast
advertise_size: legacy
# Update the broadcast as position changes.
advertise_update_strategy: property
# Repeat interval in milliseconds.
advertise_min_interval: 100
advertise_max_interval: 100
# Include this UAV's name.
advertise_local_name: "{hostname}"
advertise_discoverable: false
enable_server: true
enable_scan: true
enable_time_service: false
enable_wifi_service: false
enable_serial_port_profile: false
auto_connect_enable: false
auto_pair: false
auto_trust: false
# Accept only these UAVs. Empty accepts all.
peer_whitelist:
  - uav42
  - uav99

# -----------------------------------------------------------------------------
# Data to send
# Keep this section identical on all UAVs.
shared_topics:
  - name: swarm_odometry_advertisement
    transport: advertisement
    framing: bare
    mode: both
    payload_format: struct
    export_topic: /{hostname}/estimation_manager/odom_main
    import_topic_suffix: estimation_manager/odom_main
    message_type: nav_msgs/msg/Odometry
    rate_hz: 1.0
    members_encode:
      # Store the time in one value.
      - target: timestamp_ns
        type: uint64
        expression: header.stamp.sec * 1000000000 + header.stamp.nanosec

      # Store orientation as three short angles.
      - target: roll
        type: int16
        expression: >-
          (32767.0 / pi) * atan2(2.0 * (pose.pose.orientation.w * pose.pose.orientation.x +
          pose.pose.orientation.y * pose.pose.orientation.z),
          1.0 - 2.0 * (pose.pose.orientation.x * pose.pose.orientation.x +
          pose.pose.orientation.y * pose.pose.orientation.y))
      - target: pitch
        type: int16
        expression: >-
          (32767.0 / pi) * asin(clamp(2.0 * (pose.pose.orientation.w * pose.pose.orientation.y -
          pose.pose.orientation.z * pose.pose.orientation.x), -1.0, 1.0))
      - target: yaw
        type: int16
        expression: >-
          (32767.0 / pi) * atan2(2.0 * (pose.pose.orientation.w * pose.pose.orientation.z +
          pose.pose.orientation.x * pose.pose.orientation.y),
          1.0 - 2.0 * (pose.pose.orientation.y * pose.pose.orientation.y +
          pose.pose.orientation.z * pose.pose.orientation.z))

      # Store XYZ position in metres.
      - target: pose.pose.position.x
        type: float32
      - target: pose.pose.position.y
        type: float32
      - target: pose.pose.position.z
        type: float32

    # Rebuild the usual ROS fields.
    members_decode:
      - target: header.stamp.sec
        expression: timestamp_ns / 1000000000
      - target: header.stamp.nanosec
        expression: timestamp_ns % 1000000000
      - target: pose.pose.orientation.w
        expression: >-
          cos(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) +
          sin(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.x
        expression: >-
          sin(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) -
          cos(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.y
        expression: >-
          cos(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0) +
          sin(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0)
      - target: pose.pose.orientation.z
        expression: >-
          cos(roll * pi / 65534.0) * cos(pitch * pi / 65534.0) * sin(yaw * pi / 65534.0) -
          sin(roll * pi / 65534.0) * sin(pitch * pi / 65534.0) * cos(yaw * pi / 65534.0)
